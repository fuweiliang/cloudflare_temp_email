name: Deploy Frontend

on:
  workflow_run:
    workflows: [Upstream Sync]
    types: [completed]
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  deploy-frontend:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: frontend-worker-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: pnpm/action-setup@v5
        name: Install pnpm
        with:
          version: 10
          run_install: false

      - name: Build and deploy frontend to morning-wave-84d2
        working-directory: frontend
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN FRONTEND_ENV_CONTENT; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required configuration: $key"
              exit 1
            fi
          done
          printf '%s\n' "$FRONTEND_ENV_CONTENT" > .env.prod
          pnpm install --no-frozen-lockfile
          pnpm run build
          pnpm exec wrangler deploy --name morning-wave-84d2 --assets ./dist --compatibility-date 2026-10-05 --keep-vars
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FRONTEND_ENV_CONTENT: ${{ secrets.FRONTEND_ENV }}

  deploy-telegram-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: pnpm/action-setup@v5
        name: Install pnpm
        with:
          version: 10
          run_install: false

      - name: Deploy Telegram Frontend for ${{ github.ref_name }}
        if: ${{ env.TG_FRONTEND_NAME != '' }}
        run: |
          cd frontend/
          echo "${{ secrets.FRONTEND_ENV }}" > .env.prod
          pnpm install --no-frozen-lockfile
          export frontend_branch="${{ secrets.FRONTEND_BRANCH }}"
          if [ -n "$frontend_branch" ]; then
            echo "Deploying telegram mini app branch $frontend_branch"
            pnpm run deploy:actions:telegram --project-name=$TG_FRONTEND_NAME --branch $frontend_branch
          else
            echo "Deploying telegram mini app branch production"
            pnpm run deploy:telegram --project-name=$TG_FRONTEND_NAME
          fi
          echo "Deployed telegram mini app for ${{ github.ref_name }}"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TG_FRONTEND_NAME: ${{ secrets.TG_FRONTEND_NAME }}
