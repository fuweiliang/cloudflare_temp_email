name: Check Deployment Secrets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check_deployment_secrets.yaml"

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate configuration without exposing secret values
        shell: python
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BACKEND_TOML: ${{ secrets.BACKEND_TOML }}
          FRONTEND_ENV: ${{ secrets.FRONTEND_ENV }}
        run: |
          import json
          import os
          import sys
          import tomllib
          import urllib.error
          import urllib.request
          
          errors = 0
          
          def check(ok, message):
              global errors
              print(("PASS: " if ok else "::error::") + message)
              if not ok:
                  errors += 1
              return ok
          
          required = ("CLOUDFLARE_ACCOUNT_ID", "CLOUDFLARE_API_TOKEN", "BACKEND_TOML", "FRONTEND_ENV")
          for name in required:
              check(bool(os.environ.get(name, "").strip()), name + " is configured")
          
          account = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "")
          token = os.environ.get("CLOUDFLARE_API_TOKEN", "")
          account_ok = check(account == "5bb22c0e81c23ac87dd20fcd899b96d8", "Cloudflare account ID matches the deployment account")
          check(not any(c.isspace() for c in token), "Cloudflare API token contains no whitespace")
          check(not token.lower().startswith("bearer "), "Secret contains the token value without a Bearer prefix")
          
          try:
              config = tomllib.loads(os.environ.get("BACKEND_TOML", ""))
              check(config.get("name") == "mailapi", "BACKEND_TOML targets mailapi")
              check(config.get("main") == "src/worker.ts", "BACKEND_TOML uses the backend entry point")
              check(config.get("keep_vars") is True, "BACKEND_TOML preserves existing dashboard variables")
              db = config.get("d1_databases", [])
              kv = config.get("kv_namespaces", [])
              check(any(isinstance(x, dict) and x.get("binding") == "DB" and x.get("database_id") == "dc80d29c-930f-4da9-baa1-99dd3afa3062" for x in db), "BACKEND_TOML uses the existing D1 database")
              check(any(isinstance(x, dict) and x.get("binding") == "KV" and x.get("id") == "4a85e1a9f1e940f1a118814de83f032d" for x in kv), "BACKEND_TOML uses the existing KV namespace")
          except Exception:
              check(False, "BACKEND_TOML must contain a valid TOML deployment configuration")
          
          frontend = {}
          for line in os.environ.get("FRONTEND_ENV", "").splitlines():
              line = line.strip()
              if line and not line.startswith("#") and "=" in line:
                  key, value = line.removeprefix("export ").split("=", 1)
                  frontend[key.strip()] = value.strip().strip("\"'")
          check(frontend.get("VITE_API_BASE", "").rstrip("/") == "https://apimail.fuweilianggood.eu.org", "FRONTEND_ENV points to the existing backend API")
          
          def api_get(path):
              request = urllib.request.Request(
                  "https://api.cloudflare.com/client/v4" + path,
                  headers={"Authorization": "Bearer " + token},
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return response.status, json.load(response), []
              except urllib.error.HTTPError as error:
                  try:
                      body = json.load(error)
                      codes = [item["code"] for item in body.get("errors", []) if isinstance(item.get("code"), int)]
                  except Exception:
                      codes = []
                  return error.code, {}, codes
              except Exception:
                  return None, {}, []
          
          if account_ok and token.strip():
              active = False
              verification = []
              for path in ("/accounts/" + account + "/tokens/verify", "/user/tokens/verify"):
                  status, data, codes = api_get(path)
                  state = (data.get("result") or {}).get("status")
                  verification.append({"http": status, "codes": codes, "status": state if state in ("active", "disabled", "expired") else "unavailable"})
                  if data.get("success") is True and state == "active":
                      active = True
                      break
              check(active, "Cloudflare token is active")
              if not active:
                  print("Token verification results (no credentials): " + json.dumps(verification))
              for worker in ("mailapi", "morning-wave-84d2"):
                  for endpoint in ("scripts/" + worker + "/settings", "services/" + worker):
                      status, data, codes = api_get("/accounts/" + account + "/workers/" + endpoint)
                      if data.get("success") is True:
                          check(True, "Token can read workers/" + endpoint)
                      else:
                          check(False, "Token cannot read workers/" + endpoint + " (HTTP " + str(status) + ", Cloudflare codes " + str(codes) + "); check Worker permissions, account scope, and client IP restrictions")
          
          print("Checks complete. This workflow makes no Cloudflare changes and does not verify deployment write permission.")
          sys.exit(1 if errors else 0)
